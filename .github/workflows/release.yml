name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every release step but do not publish or tag anything
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Build precedes test: scaffolding vendors built package output.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm validate

      # The packed smoke captures a slide, which needs a real browser.
      - run: pnpm exec playwright install --with-deps chromium

      # Prove the tarballs a consumer would install actually work.
      - run: node tests/pack-consumer-smoke.mjs

      - name: Check the release is publishable
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            PKG="$(node -p "require('./package.json').version")"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag $TAG does not match package version $PKG."
              exit 1
            fi
          fi
          if [ "$DRY_RUN" != "true" ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it with: gh secret set NPM_TOKEN --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Publish packages
        if: ${{ inputs.dry_run != true }}
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report what a real run would publish
        if: ${{ inputs.dry_run == true }}
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --dry-run

      - name: Create the GitHub release
        if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file <(node scripts/changelog-section.mjs "$GITHUB_REF_NAME")
        env:
          GH_TOKEN: ${{ github.token }}
