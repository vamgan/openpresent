name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every release step but do not publish or tag anything
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Build precedes test: scaffolding vendors built package output.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm validate

      # The packed smoke captures a slide, which needs a real browser.
      - run: pnpm exec playwright install --with-deps chromium

      # Prove the tarballs a consumer would install actually work.
      - run: node tests/pack-consumer-smoke.mjs

      - name: Check the release is publishable
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            PKG="$(node -p "require('./package.json').version")"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag $TAG does not match package version $PKG."
              exit 1
            fi
          fi

      # Pack with pnpm, publish with npm. pnpm rewrites the workspace:*
      # ranges into the tarball but cannot exchange an OIDC token; npm can do
      # the token exchange but would ship "workspace:*" verbatim. Packing first
      # gives us correct dependencies and keyless publishing at once.
      - name: Pack the packages
        run: pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "${{ runner.temp }}/packs"

      - name: Fail if any tarball still carries a workspace range
        run: |
          for tarball in "${{ runner.temp }}"/packs/*.tgz; do
            if tar -xzOf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "::error::$tarball ships an unresolved workspace range."
              exit 1
            fi
          done

      # Trusted publishing needs a newer npm than Node 22 bundles.
      - run: npm install -g npm@latest

      - name: Publish packages
        if: ${{ inputs.dry_run != true }}
        run: |
          for tarball in "${{ runner.temp }}"/packs/*.tgz; do
            npm publish "$tarball" --access public
          done

      - name: Report what a real run would publish
        if: ${{ inputs.dry_run == true }}
        run: |
          for tarball in "${{ runner.temp }}"/packs/*.tgz; do
            npm publish "$tarball" --access public --dry-run
          done

      - name: Create the GitHub release
        if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file <(node scripts/changelog-section.mjs "$GITHUB_REF_NAME")
        env:
          GH_TOKEN: ${{ github.token }}
